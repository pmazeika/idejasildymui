backend:
  name: github
  repo: pmazeika/idejasildymui
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: "produktai"
    label: "Produktai"
    folder: "src/content/produktai"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Pavadinimas", name: "title", widget: "string" }
      - { label: "Antraštė", name: "subtitle", widget: "string" }
      - { label: "Aprašymas", name: "description", widget: "text" }
      - { label: "Nuotrauka", name: "image", widget: "image", required: false }
  - name: "settings"
    label: "Svetainės nustatymai"
    files:
      - name: "general"
        label: "Bendra informacija"
        file: "src/content/settings.json"
        fields:
          - { label: "Įmonės pavadinimas", name: "companyName", widget: "string" }
          - { label: "Telefonas", name: "phone", widget: "string" }
          - { label: "El. paštas", name: "email", widget: "string" }
          - { label: "Adresas", name: "address", widget: "string" }
